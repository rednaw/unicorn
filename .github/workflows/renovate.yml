name: Renovate

on:
  schedule:
    # Monday 04:00 UTC — aligns with renovate.json (before 06:00 Europe/Amsterdam).
    # Renovate's internal schedule still controls when PRs are opened.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.17
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
