services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: unicorn-dev:latest
    container_name: unicorn-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount the project. node_modules is shared with the host so Cursor
      # gets TS IntelliSense, but it's pnpm-installed from inside the container.
      - .:/app:cached
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
